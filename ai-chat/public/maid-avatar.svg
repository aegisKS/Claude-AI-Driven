<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#f3e8ff"/>

  <!-- Hair back -->
  <circle cx="50" cy="36" r="24" fill="#3b1f6e"/>
  <!-- Side hair -->
  <ellipse cx="27" cy="47" rx="8" ry="15" fill="#3b1f6e"/>
  <ellipse cx="73" cy="47" rx="8" ry="15" fill="#3b1f6e"/>

  <!-- Neck -->
  <rect x="46" y="57" width="8" height="9" rx="3" fill="#fde8d8"/>

  <!-- Dress -->
  <ellipse cx="50" cy="84" rx="27" ry="23" fill="#4a1d6e"/>

  <!-- Collar (white V-shape) -->
  <polygon points="38,63 50,72 62,63" fill="white"/>

  <!-- Apron -->
  <ellipse cx="50" cy="87" rx="13" ry="17" fill="white" opacity="0.95"/>

  <!-- Apron bow knot -->
  <circle cx="50" cy="72" r="3" fill="white"/>
  <!-- Bow left -->
  <ellipse cx="44" cy="71" rx="5" ry="3" fill="white" transform="rotate(-20 44 71)"/>
  <!-- Bow right -->
  <ellipse cx="56" cy="71" rx="5" ry="3" fill="white" transform="rotate(20 56 71)"/>

  <!-- Face -->
  <circle cx="50" cy="37" r="22" fill="#fde8d8"/>

  <!-- Headdress frills (drawn before band so band sits on top) -->
  <path d="M29,19 Q32,12 35,19 Q38,12 41,19 Q44,12 47,19 Q50,12 53,19 Q56,12 59,19 Q62,12 65,19 Q68,12 71,19" fill="white"/>
  <!-- Headdress band -->
  <rect x="29" y="19" width="42" height="9" rx="4.5" fill="white"/>
  <!-- Headdress ribbon centre -->
  <circle cx="50" cy="23" r="3.5" fill="#e879f9"/>
  <circle cx="50" cy="23" r="1.8" fill="white"/>

  <!-- Eyebrows -->
  <path d="M36,32 Q41,29 46,32" stroke="#3b1f6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54,32 Q59,29 64,32" stroke="#3b1f6e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eye whites -->
  <ellipse cx="41" cy="39" rx="6.5" ry="7" fill="white"/>
  <ellipse cx="59" cy="39" rx="6.5" ry="7" fill="white"/>
  <!-- Upper eyelid line -->
  <path d="M34.5,37 Q41,31.5 47.5,37" stroke="#3b1f6e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M52.5,37 Q59,31.5 65.5,37" stroke="#3b1f6e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Iris -->
  <ellipse cx="41" cy="40" rx="4.5" ry="5.5" fill="#7c3aed"/>
  <ellipse cx="59" cy="40" rx="4.5" ry="5.5" fill="#7c3aed"/>
  <!-- Pupil -->
  <ellipse cx="41" cy="40.5" rx="2.5" ry="3" fill="#1e0a3c"/>
  <ellipse cx="59" cy="40.5" rx="2.5" ry="3" fill="#1e0a3c"/>
  <!-- Eye shine -->
  <circle cx="43.5" cy="37.5" r="1.5" fill="white"/>
  <circle cx="61.5" cy="37.5" r="1.5" fill="white"/>

  <!-- Nose -->
  <path d="M49,48 Q50,50 51,48" stroke="#f0a898" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M44,52 Q50,59 56,52" stroke="#e88080" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="34" cy="48" rx="5.5" ry="3" fill="#ffb7b7" opacity="0.55"/>
  <ellipse cx="66" cy="48" rx="5.5" ry="3" fill="#ffb7b7" opacity="0.55"/>
</svg>
