<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: 48px auto; padding: 0 20px; }
        h1 { font-size: 2rem; margin-bottom: 28px; color: #2c3e50; letter-spacing: -0.5px; }
        .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
        .add-form input {
            flex: 1; padding: 12px 16px; border: 2px solid #dde3ea;
            border-radius: 10px; font-size: 1rem; outline: none;
            background: white; transition: border-color 0.2s;
        }
        .add-form input:focus { border-color: #3498db; }
        .add-form button {
            padding: 12px 22px; background: #3498db; color: white;
            border: none; border-radius: 10px; font-size: 1rem;
            cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }
        .add-form button:hover { background: #2980b9; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filters { display: flex; gap: 6px; }
        .filter-btn {
            padding: 6px 14px; border: 2px solid #dde3ea; border-radius: 20px;
            background: white; cursor: pointer; font-size: 0.85rem; color: #666;
            transition: all 0.2s;
        }
        .filter-btn.active { border-color: #3498db; background: #3498db; color: white; }
        .stats { font-size: 0.85rem; color: #999; }
        .todo-list { list-style: none; }
        .todo-item {
            background: white; border-radius: 10px; padding: 14px 16px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: opacity 0.2s;
        }
        .todo-item.completed { opacity: 0.6; }
        .todo-item.completed .todo-title { text-decoration: line-through; color: #999; }
        .toggle-btn {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid #3498db; background: none;
            cursor: pointer; flex-shrink: 0; transition: background 0.2s;
        }
        .todo-item.completed .toggle-btn { background: #3498db; }
        .todo-title { flex: 1; font-size: 1rem; line-height: 1.4; }
        .delete-btn {
            background: none; border: none; color: #e74c3c;
            cursor: pointer; font-size: 1.3rem; padding: 0 4px;
            opacity: 0.4; transition: opacity 0.2s; line-height: 1;
        }
        .delete-btn:hover { opacity: 1; }
        .empty { text-align: center; color: #aaa; padding: 48px 0; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TODO</h1>
        <div class="add-form">
            <input type="text" id="new-todo" placeholder="新しいタスクを入力..." autofocus>
            <button onclick="addTodo()">追加</button>
        </div>
        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all', this)">すべて</button>
                <button class="filter-btn" onclick="setFilter('active', this)">未完了</button>
                <button class="filter-btn" onclick="setFilter('completed', this)">完了</button>
            </div>
            <span class="stats" id="stats"></span>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos') || '[]');
        let filter = 'all';

        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function render() {
            const list = document.getElementById('todo-list');
            const filtered = todos.filter(t =>
                filter === 'all' ? true : filter === 'completed' ? t.completed : !t.completed
            );

            const completed = todos.filter(t => t.completed).length;
            document.getElementById('stats').textContent =
                todos.length ? `${completed} / ${todos.length} 完了` : '';

            if (filtered.length === 0) {
                list.innerHTML = '<li class="empty">タスクがありません。追加してみましょう！</li>';
                return;
            }

            list.innerHTML = filtered.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <button class="toggle-btn" onclick="toggle(${todo.id})" title="完了/未完了"></button>
                    <span class="todo-title">${escapeHtml(todo.title)}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})" title="削除">×</button>
                </li>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function addTodo() {
            const input = document.getElementById('new-todo');
            const title = input.value.trim();
            if (!title) return;
            todos.unshift({ id: Date.now(), title, completed: false });
            input.value = '';
            save();
            render();
        }

        function toggle(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) { todo.completed = !todo.completed; save(); render(); }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            save();
            render();
        }

        function setFilter(f, btn) {
            filter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        document.getElementById('new-todo').addEventListener('keydown', e => {
            if (e.key === 'Enter') addTodo();
        });

        render();
    </script>
</body>
</html>
